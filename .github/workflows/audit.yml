name: Security Audit

on:
  pull_request:
    paths:
      - "**/Gemfile"
      - "**/Gemfile.lock"
      - "scripts/audit_gems.rb"
  push:
    branches:
      - main
    paths:
      - "**/Gemfile"
      - "**/Gemfile.lock"
      - "scripts/audit_gems.rb"
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundler-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install database client headers
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "https://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          fi
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 && break
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 10
          done
          sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev freetds-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run bundler-audit
        run: ruby scripts/audit_gems.rb

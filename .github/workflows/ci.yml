name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  changes:
    name: Select CI jobs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ github.event_name != 'pull_request' || steps.filter.outputs.full == 'true' }}
      changes: ${{ steps.filter.outputs.changes || '[]' }}
    steps:
      - name: Detect pull request changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            full:
              - "packages/better_auth/**"
              - "Gemfile"
              - "Gemfile.lock"
              - "Rakefile"
              - ".ruby-version"
              - "scripts/**"
              - "test/support/**"
              - ".github/workflows/**"
              - "reference/upstream-better-auth/**"
              - "!packages/better_auth/**/*.md"
            test-workspace:
              - "**"
              - "!docs/**"
              - "!docs-site/**"
            docs-site:
              - "docs-site/**"
              - deleted|renamed: "packages/**"
            test-passkey:
              - "packages/better_auth-passkey/**"
              - "packages/better_auth-mongodb/**"
              - "!**/*.md"
            test-cli:
              - "packages/better_auth-cli/**"
              - "!**/*.md"
            test-api-key:
              - "packages/better_auth-api-key/**"
              - "packages/better_auth-mongodb/**"
              - "packages/better_auth-redis-storage/**"
              - "!**/*.md"
            test-rails:
              - "packages/better_auth-rails/**"
              - "packages/better_auth-passkey/**"
              - "!**/*.md"
            test-sinatra:
              - "packages/better_auth-sinatra/**"
              - "!**/*.md"
            test-roda:
              - "packages/better_auth-roda/**"
              - "!**/*.md"
            test-hanami:
              - "packages/better_auth-hanami/**"
              - "!**/*.md"
            test-grape:
              - "packages/better_auth-grape/**"
              - "!**/*.md"
            test-oauth-provider:
              - "packages/better_auth-oauth-provider/**"
              - "packages/better_auth-mongodb/**"
              - "!**/*.md"
            test-redis-storage:
              - "packages/better_auth-redis-storage/**"
              - "!**/*.md"
            test-mongodb:
              - "packages/better_auth-mongodb/**"
              - "!**/*.md"
            test-mongo-adapter:
              - "packages/better_auth-mongo-adapter/**"
              - "packages/better_auth-mongodb/**"
              - "!**/*.md"
            test-scim:
              - "packages/better_auth-scim/**"
              - "!**/*.md"
            test-oidc:
              - "packages/better_auth-oidc/**"
              - "packages/better_auth-saml/**"
              - "packages/better_auth-sso/**"
              - "!**/*.md"
            test-saml:
              - "packages/better_auth-saml/**"
              - "packages/better_auth-oidc/**"
              - "packages/better_auth-sso/**"
              - "!**/*.md"
            test-sso:
              - "packages/better_auth-sso/**"
              - "packages/better_auth-oidc/**"
              - "packages/better_auth-saml/**"
              - "!**/*.md"
            test-stripe:
              - "packages/better_auth-stripe/**"
              - "!**/*.md"
            test-telemetry:
              - "packages/better_auth-telemetry/**"
              - "!**/*.md"

  lint-workspace:
    name: Lint workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run linter
        run: bundle exec standardrb

  test-workspace:
    name: Test workspace release metadata
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.changes), 'test-workspace')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install database client headers
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 && break
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 10
          done
          sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev freetds-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run workspace packaging tests
        env:
          RUBYOPT: -r${{ github.workspace }}/test/support/strict_minitest
        run: bundle exec rake test:workspace

  test-core:
    name: Test better_auth (Core)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch upstream Better Auth sources
        run: ./scripts/fetch-upstream-better-auth.sh

      - name: Install FreeTDS headers
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "https://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10
          sudo apt-get install -y --no-install-recommends freetds-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: packages/better_auth


      - name: Run tests

        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: packages/better_auth-telemetry


      - name: Run tests
        working-directory: packages/better_auth-telemetry
        env:
          RUBYOPT: -r${{ github.workspace }}/test/support/strict_minitest
        run: bundle exec rake test

  docs-site:
    name: Docs site
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.changes), 'docs-site')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch upstream Better Auth sources
        working-directory: .
        run: ./scripts/fetch-upstream-better-auth.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:parity-check
      - run: pnpm format:check
      - run: pnpm lint
      - run: NEXT_PUBLIC_URL=https://example.com pnpm build

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint-workspace
      - test-workspace
      - test-core
      - test-passkey
      - test-cli
      - test-api-key
      - test-rails
      - test-sinatra
      - test-hanami
      - test-grape
      - test-roda
      - test-oauth-provider
      - test-redis-storage
      - test-mongodb
      - test-mongo-adapter
      - test-scim
      - test-oidc
      - test-saml
      - test-sso
      - test-stripe
      - test-telemetry
      - docs-site
    if: always()
    steps:
      - name: Require every selected CI job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
